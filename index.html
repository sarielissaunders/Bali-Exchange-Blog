       frangipani orange, rice-paddy green, ocean teal,

    --frangipani: #f28c45;   /* frangipani blossom orange */

  section { padding: 4rem 8%; }

  .card {

    box-shadow: 0 4px 12px rgba(0,0,0,.08); display: flex; flex-direction: column;
  }
  .card img { width: 100%; height: 180px; object-fit: cover; }
  .card .body { padding: 1.5rem; }
  .card h3 { color: var(--rice); margin-bottom: .5rem; }
  .tag {
    display: inline-block; background: var(--gold); color: var(--stone);
    font-size: .75rem; font-family: 'Segoe UI', sans-serif;
    padding: .15rem .6rem; border-radius: 12px; margin-bottom: .6rem;
  }

  /* About */
  .about { background: #fff; }
  .about .grid { align-items: center; }
  .about img { width: 100%; border-radius: 12px; }

  /* FAQ */
  details { background: #fff; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: .8rem; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  summary { cursor: pointer; font-family: 'Segoe UI', sans-serif; font-weight: bold; }
  details p { margin-top: .6rem; }

  /* Contact */

  }
  textarea { min-height: 140px; resize: vertical; }
  form .btn { border: none; cursor: pointer; font-size: 1rem; }
